<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>Lista de Links</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      background: linear-gradient(135deg, #f8fafc, #dbeafe, #bfdbfe);
      min-height: 100vh;
      display: flex;
    }


  </style>


</head>

<body class="bg-dark text-light">

  <div class="container mt-5">

 <div class="d-flex justify-content-between align-items-center mb-4">

  <h1>Lista de Links</h1>

  <div class="d-flex gap-2">

    <a href="{% url 'criar_link' %}"
       class="btn btn-dark btn-sm">

      Novo Link

    </a>

    <a href="{% url 'index' %}"
       class="btn btn-dark btn-sm">

      Home

    </a>

  </div>

</div>

    {% for link in links %}

      <div class="card mb-3">

        <div class="card-body">

          <h3>{{ link.titulo }}</h3>

          <p>
            <a href="{{ link.link }}">
              {{ link.link }}
            </a>
          </p>

          <p>{{ link.observacao }}</p>

          <a href="{% url 'editar_link' link.id %}"
             class="btn btn-warning">

             Editar

          </a>

          <a href="{% url 'deletar_link' link.id %}"
             class="btn btn-danger">

             Excluir

          </a>

        </div>

      </div>

    {% endfor %}

  </div>

</body>

</html>
