<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastrar Link</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      background: linear-gradient(135deg, #f8fafc, #dbeafe, #bfdbfe);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      margin-left: 20%;
      max-width: 700px;
      border-radius: 1rem;
    }

    a {
        display: flex;
        margin-left: 45%;
    }
  </style>

</head>

<body>

  <div class="container">

        <div class="d-flex justify-content-between mb-4">


       <a href="{% url 'index' %}" class="btn btn-dark">
        Home
      </a>

    </div>


    <div class="card p-4">

      <h2 class="mb-4 text-center">
        Cadastrar Link
      </h2>

      <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}
      
      <button type="submit" class="btn btn-primary">
        Salvar
      </button>

      </form>

    </div>

  </div>

</body>

</html>
